<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Badminton Scoreboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scoreboard" aria-label="バドミントン スコアボード">
    <header class="topbar">
      <p class="eyebrow">BADMINTON SCOREBOARD</p>
      <div class="game-count" aria-live="polite">GAME <strong id="games-a">0</strong><span>−</span><strong id="games-b">0</strong></div>
    </header>

    <section class="court" aria-label="現在のスコア">
      <article class="player player-a" id="panel-a">
        <div class="player-head">
          <label for="name-a">PLAYER / TEAM A</label>
          <input id="name-a" type="text" value="PLAYER A" maxlength="40" autocomplete="off" aria-label="プレイヤーAの名前">
          <div class="serve" id="serve-a" aria-label="プレイヤーAがサーブ"><span></span> SERVE</div>
        </div>
        <button class="score-button" id="add-a" type="button" aria-label="プレイヤーAに1点追加">
          <span class="score" id="score-a">0</span>
          <span class="add-label">＋1</span>
        </button>
      </article>

      <div class="divider" aria-hidden="true"><span>−</span></div>

      <article class="player player-b" id="panel-b">
        <div class="player-head">
          <label for="name-b">PLAYER / TEAM B</label>
          <input id="name-b" type="text" value="PLAYER B" maxlength="40" autocomplete="off" aria-label="プレイヤーBの名前">
          <div class="serve" id="serve-b" aria-label="プレイヤーBがサーブ"><span></span> SERVE</div>
        </div>
        <button class="score-button" id="add-b" type="button" aria-label="プレイヤーBに1点追加">
          <span class="score" id="score-b">0</span>
          <span class="add-label">＋1</span>
        </button>
      </article>
    </section>

    <footer class="controls" aria-label="試合操作">
      <button id="undo" type="button">↶ <span>1点戻す</span></button>
      <button id="reset-game" type="button">現在のゲームをリセット</button>
      <button id="reset-match" class="danger" type="button">試合全体をリセット</button>
      <button id="fullscreen" type="button">⛶ <span>フルスクリーン</span></button>
    </footer>
  </main>

  <div class="modal" id="serve-modal" role="dialog" aria-modal="true" aria-labelledby="serve-title">
    <div class="modal-card">
      <p class="eyebrow">MATCH SETUP</p>
      <h1 id="serve-title">最初のサーバーを選択</h1>
      <p>試合を開始する選手・チームを選んでください</p>
      <div class="modal-actions">
        <button id="start-a" type="button">PLAYER A</button>
        <button id="start-b" type="button">PLAYER B</button>
      </div>
    </div>
  </div>

  <div class="modal winner-modal" id="winner-modal" role="dialog" aria-modal="true" aria-labelledby="winner-title" hidden>
    <div class="modal-card">
      <p class="eyebrow">MATCH FINISHED</p>
      <h1 id="winner-title"><span id="winner-name">PLAYER A</span><small>WINNER</small></h1>
      <div class="modal-actions">
        <button id="undo-finish" type="button">↶ 最後の1点を戻す</button>
        <button id="new-match" type="button">新しい試合を始める</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
